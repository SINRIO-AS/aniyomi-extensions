name: Build Hentai Risto APK (Branch Bridge)



on:

  workflow_dispatch: {}
  


permissions:

  contents: read
  


jobs:

  build:
  
    name: Assemble Hentai Risto debug APK
    
    runs-on: ubuntu-latest
    
    env:
    
      CI: "false"
      


    steps:
    
      - name: Checkout source
      
        uses: actions/checkout@v4
        


      - name: Validate Gradle Wrapper
      
        uses: gradle/wrapper-validation-action@v2
        


      - name: Set up JDK 17
      
        uses: actions/setup-java@v4
        
        with:
        
          distribution: temurin
          
          java-version: "17"
          


      - name: Set up Gradle
      
        uses: gradle/actions/setup-gradle@v3
        


      - name: Build Hentai Risto
      
        run: ./gradlew src:ar:hentairisto:assembleDebug --stacktrace
        


      - name: Upload debug APK
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: aniyomi-hentai-risto-debug-apk
          
          path: src/ar/hentairisto/build/outputs/apk/debug/*.apk
          
          if-no-files-found: error
          
          retention-days: 14
          




























