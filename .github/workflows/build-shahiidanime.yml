name: Build Hentai Risto APK (Branch Bridge)



on:

  workflow_dispatch: {}
  


permissions:

  contents: read
  


jobs:

  build:
  
    name: Assemble signed Hentai Risto release APK
    
    runs-on: ubuntu-latest
    
    env:
    
      CI: "false"
      
      KEY_STORE_PASSWORD: ${{ secrets.HENTAIRISTO_KEYSTORE_PASSWORD }}
      
      KEY_PASSWORD: ${{ secrets.HENTAIRISTO_KEY_PASSWORD }}
      
      ALIAS: ${{ secrets.HENTAIRISTO_KEY_ALIAS }}
      
    steps:
    
      - name: Checkout source
      
        uses: actions/checkout@v4
        
      - name: Validate Gradle Wrapper
      
        uses: gradle/wrapper-validation-action@v2
        
      - name: Set up JDK 17
      
        uses: actions/setup-java@v4
        
        with:
        
          distribution: temurin
          
          java-version: "17"
          
      - name: Set up Gradle
      
        uses: gradle/actions/setup-gradle@v3
        
      - name: Restore Hentai Risto signing key
      
        shell: bash
        
        run: echo "${{ secrets.HENTAIRISTO_KEYSTORE_B64 }}" | base64 --decode > signingkey.jks
        
      - name: Build signed Hentai Risto release APK
      
        run: ./gradlew src:ar:hentairisto:assembleRelease --stacktrace
        
      - name: Upload signed release APK
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: aniyomi-hentai-risto-release-apk
          
          path: src/ar/hentairisto/build/outputs/apk/release/*.apk
          
          if-no-files-found: error
          
          retention-days: 14
          


































