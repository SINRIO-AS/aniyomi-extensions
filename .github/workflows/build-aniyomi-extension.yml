name: Build Rule34Video Aniyomi Extension

on:
  workflow_dispatch:
  push:
    branches: [ main, rule34video-fix ]

permissions:
  contents: read

jobs:
  build-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager 'platform-tools' 'build-tools;35.0.0'

      - name: Build and sign Aniyomi extension APK
        run: |
          chmod +x scripts/build-extension.sh
          scripts/build-extension.sh

      - name: Verify extension identity
        run: |
          unzip -p dist/Rule34Video-v14.12-fixed.apk AndroidManifest.xml >/dev/null
          test -f dist/Rule34Video-v14.12-fixed.apk

      - name: Upload Aniyomi extension APK
        uses: actions/upload-artifact@v4
        with:
          name: Rule34Video-Aniyomi-extension-fixed
          path: dist/Rule34Video-v14.12-fixed.apk
          if-no-files-found: error
          retention-days: 30
